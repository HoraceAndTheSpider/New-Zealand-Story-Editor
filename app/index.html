<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The New Zealand Story — Amiga Map Editor</title>
<link rel="stylesheet" href="style.css">
<style>
/* P11: keep both level navigation and read-only overlay controls reachable. */
.workspace .left{overflow-y:auto;scrollbar-color:#405564 transparent}
.workspace .left .levels{flex:0 0 auto;min-height:120px;max-height:215px;overflow-y:auto}
#p11EntityToggles{flex:0 0 auto;padding-bottom:12px}
#p11EntityToggles .checkbox{padding:6px 12px}
#p11EntityToggles .section-heading{padding-top:9px}
#p11EntityCanvas{pointer-events:none}
/* Long level lists are grouped into native <details> and remain keyboard accessible. */
#levels .world-fold{margin:3px 0 5px;border:1px solid #394956;border-radius:5px;overflow:hidden}
#levels .world-fold>summary{display:flex;align-items:center;gap:6px;cursor:pointer;padding:8px 9px;
  color:#bad2da;background:#1e2a34;font-weight:650;line-height:1.35;list-style:none;user-select:none}
#levels .world-fold>summary::-webkit-details-marker{display:none}
#levels .world-fold>summary::before{content:'▸';color:#70ded2;font-size:14px;flex:none}
#levels .world-fold[open]>summary::before{content:'▾'}
#levels .world-fold>summary small{margin-left:auto;color:#96b0ba;font:11px ui-monospace,monospace}
#levels .world-fold>summary:hover,#levels .world-fold>summary:focus-visible{background:#2c4247}
#levels .world-levels{padding:5px}
#levels .world-levels .level-row{margin:1px 0}
.workspace .left .levels{max-height:min(37vh,360px);min-height:95px}
#p11EntityToggles .p11-coordinates{padding:3px 12px 7px;display:flex;gap:8px;align-items:center}
#p11EntityToggles .p11-coordinates label{flex:1;display:flex;align-items:center;gap:3px;font-size:11px;color:#cbdde8}
#p11EntityToggles .p11-coordinates select{flex:1;min-width:0;width:65px;padding:5px 2px}
#p12SpriteBrowser .section-heading{padding-top:11px}
#p12SpriteBrowser .p12-controls{padding:8px 12px}
#p12SpriteBrowser .p12-controls select{width:100%}
#p12SpriteBrowser .p12-sprite-grid{max-height:260px}
#p12SpriteBrowser .p12-sprite-thumb canvas{width:auto;height:auto;max-width:39px;max-height:37px;image-rendering:pixelated}
#p12SpriteBrowser .p12-ghost-actions{display:flex;gap:5px;padding:6px 12px 13px}
#p12SpriteBrowser .p12-ghost-actions button{flex:1;white-space:normal;font-size:11px;padding:5px 3px}
.p12-sprite-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;margin:3px 8px 8px;max-height:166px;overflow-y:auto}
.p12-sprite-thumb{padding:2px;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;height:58px;gap:1px}
.p12-sprite-thumb img{max-width:36px;max-height:38px;image-rendering:pixelated}
.p12-sprite-thumb span{font:10px ui-monospace,monospace;color:#b6d7dc}
.p12-sprite-thumb.selected{border-color:#70ded2;background:#164349}
.p12-sprite-selected{padding:7px 12px 12px}
.p12-sprite-detail{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font:11px ui-monospace,monospace}
.p12-sprite-detail img{object-fit:contain;image-rendering:pixelated;max-width:150px;max-height:120px;width:auto;height:auto}
.p12-sprite-detail small{width:100%;font-size:10px;color:#89aab7;overflow-wrap:anywhere}
#p12SpriteCanvas{pointer-events:none}
#p15FrameUsage button{padding:5px 9px;margin-top:5px;font-size:11px}
#p12SpriteBrowser .p14-note{padding:6px 12px 9px;font:11px/1.5 system-ui,sans-serif;color:#a6c6d2}
#p12SpriteBrowser .p14-entity-pose{border-top:1px solid #374850;margin:8px 0}
#p12SpriteBrowser .p12-sprite-thumb canvas{max-width:39px;max-height:37px;image-rendering:pixelated}
#p12SpriteBrowser .p12-sprite-grid{max-height:320px}
#p12SpriteBrowser .p12-sprite-selected canvas{image-rendering:pixelated}
#p12SpriteBrowser .p12-ghost-actions{display:flex;gap:6px}
#p12SpriteBrowser .p12-ghost-actions button{min-width:0;flex:1}
/* Original four property bytes, 2×2; no speculative solidity labels. */
#p16TileMask{padding-bottom:8px;border-bottom:1px solid #2d414e}
#p16TileMask .p16-mask-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;width:110px;margin:7px 12px}
#p16TileMask .p16-mask-grid>div{background:#263641;border:1px solid #536b79;border-radius:3px;text-align:center;padding:7px 4px;color:#cee9dc;font:bold 13px ui-monospace,monospace}
#p16TileMask .p16-mask-bytes{padding:2px 12px;color:#d2e4ef;font:11px ui-monospace,monospace}
#p16TileMask .p16-mask-hint{padding:3px 12px 8px;color:#8eafb9;font:11px/1.3 system-ui,sans-serif}
#mapName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(52vw,650px)}
/* P19: one right-hand work mode at a time; technical trace stays collapsed. */
.p19-side-pane[hidden],.p19-generator-review[hidden]{display:none!important}
.p19-mode-switch{display:flex;position:sticky;top:0;z-index:8;gap:5px;padding:9px 10px 8px;background:#192932;border-bottom:1px solid #344754}
.p19-mode-switch button{flex:1;padding:9px 4px;border:1px solid #4c6473;border-radius:6px;background:#283946;color:#becedc;font-weight:700}
.p19-mode-switch button.selected{background:#24636c;color:#fff;border-color:#71b8b8}
.p19-side-pane{min-width:0}
.p19-calibration{display:flex;gap:7px;padding:4px 12px 9px}
.p19-calibration label{display:flex;gap:4px;align-items:center;flex:1;font-size:11px;color:#d0dce5}
.p19-calibration select{min-width:0;width:57px;padding:3px 1px;font-size:11px}
.p19-technical{margin:7px 9px;color:#b6c7d3;font-size:11px}
.p19-technical summary{cursor:pointer;padding:5px 7px;border:1px solid #465b66;border-radius:4px}
.p19-technical[open]{padding-bottom:7px}
.p19-generator-review{border-top:1px solid #38515d;margin:7px 8px;padding:9px 3px}
.p19-generator-review strong{color:#afe7d5;font-size:12px}
.p19-sequence{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.p19-sequence-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding-bottom:4px;border-bottom:1px solid #3c4e57}
.p19-sequence-line span{min-width:95px;font-size:10px;color:#bdd5e4}
.p19-sequence-line canvas{width:auto;height:auto;max-width:35px;max-height:40px;image-rendering:pixelated}
.p19-review-caption{font-size:11px;color:#c4dfe8;padding:6px 1px}
.p19-request-steps{display:flex;flex-wrap:wrap;gap:5px}
.p19-request-steps button{padding:5px 7px;font:11px ui-monospace,monospace}
.p19-request-steps button.selected{background:#2d7072;border-color:#70c5b8;color:white}
#p11Detail details{padding:4px 0;font-size:11px}
#p11Detail details summary{cursor:pointer}
/* v0.11 compact generator-sequence controls */
.p20-chain-control{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 11px;color:#dae9ef;font-size:11px}
.p20-chain-control select{min-width:0;max-width:145px;padding:5px 2px;font-size:11px}
.p20-chain-actions{display:flex;gap:5px;padding:3px 0 8px}
.p20-chain-actions button{flex:1;padding:6px 4px;font-size:11px}
.p20-live-request{font:11px ui-monospace,monospace;color:#96dfed;padding:3px 2px 5px}
.p20-native-note{display:block;font-size:10px;color:#a3bbc9;line-height:1.35;padding:5px 0}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brand-mark">NZ</div><div class="brand-text"><strong>New Zealand Story</strong><small>Amiga Map Editor <span class="version">v0.11 · Generator preview & native trace</span></small></div></div>
  <nav class="top-actions" aria-label="Files and history">
    <button id="openDisk" type="button" class="primary" title="Load an original 901,120-byte Disk.1 image">Open Disk.1</button>
    <button id="importMap" type="button" title="Import exactly 4096 map bytes for the selected stage">Import map</button>
    <span class="divider"></span>
    <button id="exportDisk" type="button" disabled title="Export map edits only; entity and warp bytes are preserved">Export Disk.1</button>
    <button id="exportMap" type="button" title="Export raw 64 × 64 tile map">Export map</button>
    <button id="exportPNG" type="button" title="Save the background map as PNG">PNG</button>
    <span class="divider"></span>
    <button id="undo" type="button" aria-label="Undo" title="Undo (U or Ctrl/Cmd+Z)">↶</button>
    <button id="redo" type="button" aria-label="Redo" title="Redo (R)">↷</button>
  </nav>
  <div id="sourceState" class="header-status">Open Disk.1</div>
  <input type="file" id="diskInput" hidden accept=".1,.adf,.bin,application/octet-stream">
  <input type="file" id="mapInput" hidden accept=".map,.bin,application/octet-stream">
</header>
<div class="workspace">
  <aside class="side left" aria-label="Level navigation and overlays">
    <div class="section-heading">LEVELS <span>21</span></div>
    <div id="levels" class="levels"></div>
    <div class="section-heading">OVERVIEW <span id="overviewLevel">1_1</span></div>
    <div class="mini-wrap"><canvas id="mini" width="256" height="256"></canvas><div id="miniFrame"></div></div>
    <div class="level-ops"><button type="button" id="revertLevel">Revert level</button></div>
    <div class="section-heading compact">DISPLAY</div>
    <label class="checkbox"><input id="toggleActive" type="checkbox" checked>Level bounds</label>
    <label class="checkbox"><input id="toggleHeaderPoint" type="checkbox">Header point</label>
    <label class="checkbox"><input id="toggleGrid" type="checkbox">Tile grid <kbd>G</kbd></label>
    <label class="checkbox"><input id="toggleMissing" type="checkbox" checked>Tiles outside bank</label>
    <div id="p11EntityToggles"></div>
  </aside>
  <main class="centre">
    <header class="edit-heading"><div><span class="eyebrow">MAP</span><strong id="mapName">World 1 · Level 1</strong><span id="dirtyFlag" class="unsaved" hidden title="Unsaved map edit">●</span></div>
      <div class="view-controls">Zoom
        <select id="zoom" title="Canvas zoom">
          <option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option><option value="4">400%</option><option id="customZoom" hidden value="1">Fit</option>
        </select><button id="fit" type="button">Fit</button>
      </div>
    </header>
    <div id="viewport" class="canvas-viewport"><div id="canvasStack" class="canvas-stack"><canvas id="mapCanvas" width="1024" height="1024"></canvas><canvas id="overlayCanvas" width="1024" height="1024" aria-label="Map editing surface"></canvas></div></div>
    <div class="statusbar"><span id="pointerInfo">X — · Y —</span><span id="mapInfo">64 × 64 tiles · 16 × 16 pixels</span><span id="message" aria-live="polite"></span></div>
  </main>
  <aside class="side right" aria-label="Drawing tools and inspected entities">
    <div class="section-heading">DRAW TOOLS <span id="toolName">Pencil</span></div>
    <div id="tools" class="tool-grid">
      <button type="button" data-tool="pencil" class="selected" title="Pencil (P)">✎</button>
      <button type="button" data-tool="fill" title="Flood fill (F)">▨</button>
      <button type="button" data-tool="pick" title="Pick tile (I)">⌖</button>
      <button type="button" data-tool="line" title="Line (L)">╱</button>
      <button type="button" data-tool="rect" title="Rectangle (B)">▢</button>
      <button type="button" data-tool="rectfilled" title="Filled rectangle (Shift+B)">▣</button>
    </div>
    <div id="p11EntityInspector"></div>
    <div class="section-heading">SELECTED TILE <span id="selectedIndex">$00</span></div>
    <div class="selection-card"><canvas id="tilePreview" width="80" height="80"></canvas><div><div id="tileNumber" class="tile-number">00</div><div id="tileAvailability" class="tile-label">Original tile</div></div></div>
    <div id="p12SpriteBrowser"></div>
    <div class="section-heading">TILE ATLAS <span id="atlasCount">—</span></div>
    <div class="atlas-scroller"><canvas id="tileGrid" width="288" height="528"></canvas></div>
    <div class="section-heading">PALETTE <span id="paletteCount">—</span></div>
    <div id="palette" class="palette"></div>
  </aside>
</div>
<script src="nzs-core.js"></script>
<script src="nzs-graphics.js"></script>
<script src="nzs-level-headers.js"></script>
<script src="data/stock-maps.js"></script>
<script src="nzs-sprite-disk.js"></script>
<script src="nzs-tile-properties.js"></script>
<script src="nzs-native-generators.js"></script>
<script src="app.js"></script>
<script src="nzs-world-navigation.js"></script>
<script src="nzs-entities.js"></script>
<script src="nzs-animation-catalogue.js"></script>
<script src="nzs-native-frame-resolver.js"></script>
<script src="nzs-sprites.js"></script>
<script src="nzs-right-modes.js"></script>
</body>
</html>
